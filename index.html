<!doctype html><html lang="fr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mékoikonfé · On sort ? On s’occupe de la suite.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout : appli mobile une colonne, onboarding en 5 "billets", puis 5 pages (Aujourd'hui, Agenda, Explorer, Favoris, Profil) avec barre d'onglets fixe */
:root{
  --bg:#EDEEF5; --surface:#FFFFFF; --ink:#16132C; --muted:#5E5A78; --line:#D6D6E6;
  --accent:#FF4F1F; --accent-ink:#FFFFFF; --ticket:#FFD43B; --teal:#0A7F78; --chip:#F4F4FA; --rose:#D63F7A;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, sans-serif;
  --mono:"DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110F22; --surface:#1C1934; --ink:#F1EFFA; --muted:#A6A2C4; --line:#2F2B4D;
  --accent:#FF6A3D; --accent-ink:#16132C; --ticket:#FFD43B; --teal:#2CC9BE; --chip:#24203F; --rose:#FF7AAE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110F22; --surface:#1C1934; --ink:#F1EFFA; --muted:#A6A2C4; --line:#2F2B4D;
  --accent:#FF6A3D; --accent-ink:#16132C; --ticket:#FFD43B; --teal:#2CC9BE; --chip:#24203F; --rose:#FF7AAE; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.stub{font-family:var(--mono);font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

.perfs{display:flex;gap:6px}
.perfs i{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.perfs i.on{background:var(--accent)}

.ticket{position:relative;background:var(--surface);border-radius:18px;padding:24px 20px 20px;
  box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(22,19,44,.45)}
.ticket.notch::before,.ticket.notch::after{content:"";position:absolute;top:92px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.ticket.notch::before{left:-11px}.ticket.notch::after{right:-11px}
.tear{border-top:2px dashed var(--line);margin:14px -20px 18px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.025em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:2.2rem;margin-top:6px}
h2{font-size:1.7rem;margin-top:6px}
.sec-title{font-size:1.3rem;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-title small{font-family:var(--mono);font-size:.72rem;font-weight:400;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lead{color:var(--muted);margin:10px 0 0;max-width:60ch}
.step{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{transform:translateY(14px);opacity:.2}to{transform:none;opacity:1}}

label.f{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input[type=text],input[type=search]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--ticket);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:16px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{font:inherit;color:var(--ink);text-align:left;background:var(--chip);border:2px solid transparent;border-radius:14px;
  padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s,background .15s;min-width:0}
.tile:hover{transform:translateY(-2px)}
.tile b{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.tile small{color:var(--muted);font-size:.8rem;line-height:1.3}
.tile .glyph{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;color:var(--accent)}
.tile[aria-pressed=true]{border-color:var(--accent);background:var(--surface);transform:rotate(-1.2deg)}
.tile[aria-pressed=true] .glyph{color:var(--ink)}
.hint{font-size:.82rem;color:var(--muted);margin:10px 0 0}

.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:8px}
.duel .tile{text-align:center;align-items:center;justify-content:center;min-height:80px}
.vs{align-self:center;font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.duels{display:flex;flex-direction:column;gap:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{font:inherit;font-size:.9rem;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chipbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:13px 22px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);padding-inline:6px}
.btn.outline{background:transparent;border:1.5px solid var(--line);color:var(--ink)}

/* bandeau de jours */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
.day{font:inherit;flex:0 0 58px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 4px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.day small{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day b{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.day i{font-style:normal;font-size:.66rem;color:var(--muted)}
.day[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed=true] small,.day[aria-pressed=true] i{color:var(--bg);opacity:.75}

.greet{display:flex;flex-direction:column;gap:2px}
.greet p{margin:0;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px}
.occ{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--ink)}
.occ.couple{color:var(--rose)}
.occ.famille{color:var(--teal)}

.cards{display:flex;flex-direction:column;gap:12px}
.ev{display:grid;grid-template-columns:72px minmax(0,1fr);background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 var(--line);cursor:pointer;text-align:left;font:inherit;color:inherit;border:0;padding:0;width:100%}
.ev .side{background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:12px 6px;border-right:2px dashed var(--bg);font-family:var(--mono);text-align:center}
.ev .side .pct{font-family:var(--display);font-weight:800;font-size:1.45rem;color:var(--ticket);line-height:1}
.ev .side small{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.ev .side .hr{font-size:.8rem;margin-top:6px;font-variant-numeric:tabular-nums}
.ev .main{padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ev .cat{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.ev h3{font-size:1.1rem;letter-spacing:-.01em;line-height:1.15}
.ev .meta{font-size:.85rem;color:var(--muted)}
.ev .why{font-size:.82rem;color:var(--ink)}
.ev .why b{color:var(--accent)}
.price{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;font-size:.85rem}
.heart{color:var(--rose)}
.empty{text-align:center;color:var(--muted);padding:18px;background:var(--surface);border-radius:16px}

/* agenda */
.agenda{display:flex;flex-direction:column;gap:10px}
.aday{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.aday .d{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;color:var(--muted);line-height:1.2}
.aday .d b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--ink);font-variant-numeric:tabular-nums}
.aday .t{min-width:0}
.aday .t strong{display:block;font-family:var(--display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aday .t span{font-size:.8rem;color:var(--muted)}
.aday .n{font-family:var(--mono);font-size:.78rem;background:var(--chip);padding:4px 9px;border-radius:999px;white-space:nowrap}
.aday.we{box-shadow:inset 4px 0 0 var(--ticket)}
.weekhead{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}

/* accueil */
.feature{font:inherit;text-align:left;border:0;cursor:pointer;background:var(--ink);color:var(--bg);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.feature .eyebrow{color:var(--ticket)}
.feature strong{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.05;letter-spacing:-.02em;padding-right:70px}
.feature>span{opacity:.85;font-size:.9rem}
.feature .fpct{position:absolute;top:18px;right:18px;opacity:1;font-family:var(--mono);font-size:.72rem;background:var(--ticket);color:#16132C;padding:4px 9px;border-radius:999px}
.carousel{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;margin-inline:-4px;padding-inline:4px}
.hcard{font:inherit;color:inherit;text-align:left;border:0;cursor:pointer;flex:0 0 200px;scroll-snap-align:start;background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;position:relative;min-height:170px;box-shadow:0 1px 0 var(--line)}
.hcard .badge{align-self:flex-start;font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:3px 8px;border-radius:999px}
.hcard .hpct{position:absolute;top:14px;right:14px;font-family:var(--display);font-weight:800;color:var(--accent)}
.hcard strong{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.1;margin-top:auto}
.hcard span{font-size:.8rem;color:var(--muted)}
.hcard .when{font-family:var(--mono);font-size:.72rem;color:var(--ink)}
.link{font:inherit;font-size:.8rem;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
.sec-title span{min-width:0}
.rows{display:flex;flex-direction:column;background:var(--surface);border-radius:16px;overflow:hidden}
.rowev{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
.rowev:last-child{border-bottom:0}
.rowev .rd{font-family:var(--mono);font-size:.72rem;color:var(--muted);line-height:1.3}
.rowev .rd b{display:block;color:var(--ink);font-size:.9rem;font-variant-numeric:tabular-nums}
.rowev .rt{min-width:0}
.rowev .rt strong{display:block;font-family:var(--display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowev .rt span{font-size:.8rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowev .rp{font-family:var(--display);font-weight:800;color:var(--accent)}
.weteaser{font:inherit;color:#16132C;background:var(--ticket);border:0;border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;text-align:left}
.weteaser small{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.weteaser strong{font-family:var(--display);font-size:1.15rem}
.weteaser .arrow{font-size:1.5rem;font-weight:700}

/* découvrir */
.swipezone{position:relative;height:min(64vh,520px);min-height:400px}
.scard{position:absolute;inset:0;border-radius:24px;color:#fff;padding:22px 20px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;overflow:hidden;
  background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 18px 40px -20px rgba(22,19,44,.6);touch-action:none;user-select:none;cursor:grab;
  transform:translateY(calc(var(--i)*10px)) scale(calc(1 - var(--i)*.04));transition:transform .25s}
.scard::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(10,8,25,.55));pointer-events:none}
.scard>*{position:relative;z-index:1}
.scard .art{position:absolute;top:22px;left:20px;right:20px;z-index:0;font-family:var(--display);font-weight:800;font-size:clamp(3.4rem,17vw,6rem);line-height:.9;letter-spacing:-.04em;opacity:.35;overflow-wrap:anywhere}
.scard h2{font-size:2rem;color:#fff;margin:0}
.scat{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.smeta{font-size:.9rem;opacity:.92}
.sfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:.85rem}
.spct{background:#FFD43B;color:#16132C;padding:4px 10px;border-radius:999px;font-weight:500}
.swhy{font-size:.82rem;opacity:.9}
.stamp{position:absolute;top:26px;z-index:2;padding:4px 12px;border:3px solid currentColor;border-radius:10px;font-family:var(--display);font-weight:800;font-size:1.5rem;opacity:0;pointer-events:none}
.stamp.like{right:20px;color:#C8FF6B;transform:rotate(12deg)}
.stamp.nope{left:20px;color:#fff;transform:rotate(-12deg)}
.scard.top:focus-visible{outline:3px solid var(--ticket);outline-offset:4px}
.swbtns{display:flex;justify-content:center;align-items:center;gap:20px}
.swb{border:0;border-radius:50%;width:60px;height:60px;background:var(--surface);color:var(--ink);font-size:1.5rem;font-weight:700;cursor:pointer;box-shadow:0 8px 20px -12px rgba(22,19,44,.6)}
.swb.like{color:var(--rose);width:68px;height:68px;font-size:1.8rem}
.swb.info{width:46px;height:46px;font-size:1.1rem;font-family:var(--display)}
.swhint{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
.swempty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--surface);border-radius:24px;text-align:center;padding:20px}
.swempty p{color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){.scard{transition:none}}

/* avis */
.avbtn{font:inherit;font-size:.82rem;font-weight:600;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:7px 12px;cursor:pointer}
.avform{display:flex;flex-direction:column;gap:16px}
.avform textarea{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);resize:vertical}
.avform textarea:focus-visible{outline:3px solid var(--ticket);outline-offset:2px}
.stars{display:flex;gap:6px}
.star{font-size:2rem;line-height:1;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:2px}
.opt{font-weight:400;color:var(--muted)}
.averr{color:var(--accent);margin:0;font-weight:600}
.avfallback{display:flex;flex-direction:column;gap:10px;background:var(--chip);border-radius:12px;padding:12px}
.avfallback p{margin:0;font-size:.88rem}
.usagebar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.usagebar div{background:var(--surface);border-radius:12px;padding:10px 12px}
.usagebar small{display:block;font-size:.72rem;color:var(--muted)}
.usagebar b{font-family:var(--display);font-size:1.3rem}
.avlist{display:flex;flex-direction:column;gap:10px}
.avitem{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.avitem p{margin:0;font-size:.9rem}
.avhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.avstars{color:var(--accent);letter-spacing:2px;font-size:1rem}

/* billets */
.agroup{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.agroup small{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.agroup .chipbtn{font-size:.82rem;padding:6px 12px}
.addart{display:flex;gap:8px}
.addart input{flex:1;min-width:0}
.artbox{background:var(--surface);border-radius:16px;padding:14px}
.artbox summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.artbox summary::-webkit-details-marker{display:none}
.artbox summary small{display:block;font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.artbox summary strong{font-family:var(--display);font-size:1rem}
.artbox[open] summary{margin-bottom:10px}
.artok{width:100%;margin-top:14px;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.tks{display:flex;flex-direction:column;gap:10px}
.tk{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px;align-items:start}
.tk.mine{box-shadow:inset 4px 0 0 var(--accent)}
.tkdate{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--chip);border-radius:12px;padding:8px 4px;text-align:center;min-height:64px}
.tkdate small{font-family:var(--mono);font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tkdate b{font-family:var(--display);font-size:1.5rem;line-height:1.05;font-variant-numeric:tabular-nums}
.tkdate i{font-style:normal;font-size:.72rem;color:var(--muted)}
.pill{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;border-radius:8px;background:var(--line);color:var(--ink);line-height:1.2}
.pill.ok{background:var(--teal);color:var(--surface)}
.tkmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.tkmain strong{font-family:var(--display);font-size:1.1rem;line-height:1.15}
.tkmain>span{font-size:.85rem}
.tkmain .meta{color:var(--muted);font-size:.8rem}
.following{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:999px;vertical-align:middle}
.cd{font-family:var(--mono);font-size:.76rem;color:var(--accent);margin-top:2px}
.cd.q{color:var(--muted)}
.tkact{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.tkact a.mini{text-decoration:none}
.mini.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.alertbar{font:inherit;text-align:left;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.alertbar small{display:block;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em}
.alertbar strong{font-family:var(--display);font-size:1.1rem;display:block}
.alertbar em{font-style:normal;font-size:.8rem;opacity:.85}
.alertbar .bell{animation:pulse 1.6s infinite}
.alertbar .arrow{font-size:1.4rem;font-weight:700}
@keyframes pulse{50%{opacity:.25}}
.coll .collsub{margin:-6px 0 0;color:var(--muted);font-size:.85rem}

// Public familial : déduit des mots explicites du titre ou de la description (indicatif, à vérifier).
function famInfo(text){
  const t=String(text||'').toLowerCase();
  const strong=/jeune public|en famille|pour les enfants|aux enfants|parents?[- ]enfants?|les enfants|des enfants|enfants (?:dès|de \d)|jeunesse|marionnette|\bcontes?\b|tout[- ]petits?|b[ée]b[ée]s?|éveil musical|palais des enfants|dès \d{1,2} ?ans|à partir de \d{1,2} ?ans|\b\d{1,2} ?(?:-|à) ?\d{1,2} ans\b/;
  const weak=/tout public/;
  if(!strong.test(t)&&!weak.test(t))return null;
  let min=null;const m=t.match(/(?:dès|à partir de|a partir de)\s*(\d{1,2})\s*ans/)||t.match(/\b(\d{1,2})\s?(?:-|à)\s?\d{1,2}\s?ans\b/);
  if(m)min=+m[1];
  if(min==null){if(/tout[- ]petits?|b[ée]b[ée]s?|éveil musical/.test(t))min=0;else if(strong.test(t))min=4;else min=7}
  const bands=[[3,'0-3 ans'],[6,'4-6 ans'],[11,'7-11 ans'],[17,'12-17 ans']].filter(([max])=>max>=min).map(([,b])=>b);
  return bands.length?bands:null;
}

// moteur de recommandation, par occasion (amoureux, famille…)
function score(e,occ,d){
  let s=0, why=[];
  if(S.types.includes(e.cat)){s+=38;why.push("vous aimez "+catT(e.cat).toLowerCase())}
  const fa=followedOf(e.artists); if(fa){s+=26;why.unshift("vous suivez "+fa)}
  if(occ){ if(e.aud.includes(occ))s+=18; else if(occ==="famille"&&S.ages.includes(YA)&&(e.aud.includes("amis")||e.aud.includes("solo")))s+=12; else return null; }
  else if(S.who.some(w=>e.aud.includes(w)))s+=14;
  const fam=occ?occ==="famille":(S.who.length===1&&S.who[0]==="famille");
  if(fam){ if(ageOk(e)){s+=14;why.push(e.ages?"adapté à l'âge des enfants":"idéal avec vos grands enfants")} else return null; }
  const bst=(S.boost&&S.boost[e.cat])||0; s+=bst; if(bst>=6&&why.length<2)why.push("vous aimez ce genre en ce moment");
  if(S.duels.mood===e.mood){s+=8;why.push(e.mood==="rire"?"on va rire":"vous cherchez de l’émotion")}
  if(S.duels.size===e.size)s+=5;
  if(S.duels.style===e.style){s+=5;if(e.style==="decouverte"&&why.length<2)why.push("une vraie découverte")}
  s+=budgetScore(e.price,S.budget);
  const nr=near(S.city,e.city);
  if(nr===2){s+=10;why.unshift("dans votre ville (distance non calculée)")}else if(nr===1)s+=5;
  if(d){const we=WE.includes(d.getDay()), soir=parseInt(timeOn(e,d))>=18;
    if((!we&&soir&&S.moments.includes("semaine"))||(we&&!soir&&S.moments.includes("we_jour"))||(we&&soir&&S.moments.includes("we_soir")))s+=6;}
  return {pct:Math.max(15,Math.min(99,Math.round(s))),why:why.slice(0,2)};
}
function picksFor(d,occ,n=4){
  return EVENTS.filter(e=>playsOn(e,d)).map(e=>{const r=score(e,occ,d);return r&&{...e,...r,hr:timeOn(e,d)}}).filter(Boolean)
    .sort((a,b)=>b.pct-a.pct).slice(0,n);
}
function bestOfDay(d){
  const all=S.who.flatMap(o=>picksFor(d,o,3));
  const uniq=[...new Map(all.sort((a,b)=>b.pct-a.pct).map(e=>[e.id,e])).values()];
  return uniq;
}

async function sendAvis(){
  if(!avForm.note||avState==="sending")return;

function swAct(kind){
  const el=document.querySelector(".scard.top"); if(!el)return;
  const id=+el.dataset.sid, e=EVENTS.find(x=>x.id===id);
  if(kind==="info"){detailId=id;render();scrollTo({top:0});return}
  S.boost=S.boost||{};
  if(kind==="like"){if(!favs.includes(id))favs.push(id);swLikes++;S.boost[e.cat]=Math.min(12,(S.boost[e.cat]||0)+3);swToast="Ajouté aux favoris : "+e.t}
  else {S.boost[e.cat]=Math.max(-6,(S.boost[e.cat]||0)-1);swToast=""}
  seen.add(id);save();
  const fly=()=>{render()};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){fly();return}
  el.style.transition="transform .3s ease, opacity .3s";el.style.transform=`translate(${kind==="like"?520:-520}px,40px) rotate(${kind==="like"?24:-24}deg)`;el.style.opacity="0";
  setTimeout(fly,260);
}
function bindSwipe(){
  const el=document.querySelector(".scard.top"); if(!el)return;
  let x0=0,y0=0,dx=0,dy=0,drag=false;
  const like=el.querySelector(".stamp.like"),nope=el.querySelector(".stamp.nope");
  el.onpointerdown=ev=>{drag=true;x0=ev.clientX;y0=ev.clientY;el.setPointerCapture(ev.pointerId);el.style.transition="none"};
  el.onpointermove=ev=>{if(!drag)return;dx=ev.clientX-x0;dy=ev.clientY-y0;el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;like.style.opacity=Math.max(0,Math.min(1,dx/100));nope.style.opacity=Math.max(0,Math.min(1,-dx/100))};
  el.onpointerup=el.onpointercancel=()=>{if(!drag)return;drag=false;
    if(dx>100)swAct("like");else if(dx<-100)swAct("nope");else if(dy<-120)swAct("info");
    else{el.style.transition="transform .25s";el.style.transform="";like.style.opacity=0;nope.style.opacity=0}
    dx=dy=0};
  el.onkeydown=ev=>{if(ev.key==="ArrowRight")swAct("like");if(ev.key==="ArrowLeft")swAct("nope");if(ev.key==="ArrowUp"||ev.key==="Enter")swAct("info")};
}

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g," ");
const CATKW=[["musical",/comedie musicale|\bmusical\b|\bmusicals\b/],["humour",/humour|humoriste|drole|rigoler|stand ?up|one man|marrer/],["concert",/concert|musique|chanteu|groupe|rock|pop|rap/],["theatre",/theatre|piece/],["danse",/danse|ballet|hip ?hop/],["cirque",/cirque|magie|magicien/],["opera",/opera|classique|orchestre/],["expo",/\bexpos?\b|exposition|musee|peinture|photo|tableau/],["salon",/salon|foire|degustation/],["festival",/festival|lumiere|cinema|film|projection|avant.premiere|cine.concert/]];
const WDN=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function parseAsk(raw){
  const t=norm(raw), p={who:null,ages:[],days:null,dayLabel:"",cat:null,max:null,ids:null,rest:""};
  if(/\b(fils|fille|enfant|enfants|gamin|gamins|petit|petite|petits|bebe|famille|neveu|niece|ado|ados|kids|gosses)\b/.test(t))p.who="famille";
  else if(/\b(amoureux|amoureuse|femme|mari|copine|copain|cheri|cherie|couple|deux|romantique|date)\b/.test(t))p.who="couple";
  else if(/\b(amis|amies|potes|copains|copines|bande|collegues)\b/.test(t))p.who="amis";
  else if(/\b(seul|seule|solo)\b/.test(t))p.who="solo";
  const m=t.match(/\b(\d{1,2}) ?ans\b/);
  if(m){const a=+m[1];p.ages=[a<=3?"0-3 ans":a<=6?"4-6 ans":a<=11?"7-11 ans":a<=17?"12-17 ans":YA];if(!p.who)p.who="famille"}
  else if(/\b(bebe|tout petit|tout-petit)/.test(t))p.ages=["0-3 ans"];
  else if(/\bado/.test(t))p.ages=["12-17 ans"];
  else if(/jeune adulte|etudiant|majeur|grand fils|grande fille|grands enfants/.test(t)){p.ages=[YA];if(!p.who)p.who="famille"}
  const W=weekends(), idx=f=>DAYS.map((d,i)=>i).filter(f);
  const lbl=a=>a.length===1?dayName(a[0]):fmt(DAYS[a[0]],{day:"numeric",month:"short"})+" – "+fmt(DAYS[a[a.length-1]],{day:"numeric",month:"short"});
  if(/ce soir|aujourd hui|maintenant/.test(t))p.days=[0];
  else if(/apres.demain/.test(t))p.days=[2];
  else if(/demain/.test(t))p.days=[1];
  else if(/(week.?end|we) (prochain|suivant)|semaine prochaine.*week/.test(t))p.days=W[1];
  else if(/week.?end|\bwe\b/.test(t))p.days=W[0];
  else if(/semaine prochaine/.test(t))p.days=idx(i=>i>=7-((DAYS[0].getDay()+6)%7)&&i<14-((DAYS[0].getDay()+6)%7));
  else if(/cette semaine/.test(t))p.days=idx(i=>i<7-((DAYS[0].getDay()+6)%7));
  else if(/vacances|toussaint|noel/.test(t)){const v=idx(i=>iso(DAYS[i])>="2026-12-19"&&iso(DAYS[i])<="2027-01-03");p.days=v.length?v:idx(i=>WE.includes(DAYS[i].getDay()))}
  else if(/novembre/.test(t))p.days=idx(i=>DAYS[i].getMonth()===10);
  else {const w=WDN.findIndex(n=>new RegExp("\\b"+n+"\\b").test(t));if(w>=0){const i=DAYS.findIndex(d=>d.getDay()===w);p.days=[i]}}
  if(p.days)p.dayLabel=/week.?end|\bwe\b/.test(t)?(W.indexOf(p.days)===1?"le week-end prochain":"ce week-end")+" ("+lbl(p.days)+")":lbl(p.days);
  if(/soir|soiree|nuit/.test(t))p.mom="soir"; else if(/matin|apres.midi|journee|gouter/.test(t))p.mom="jour";
  for(const [c,re] of CATKW){if(re.test(t)){p.cat=c;break}}
  if(/candlelight|bougie/.test(t))p.ids=EVENTS.filter(e=>e.serie==="Candlelight").map(e=>e.id);
  else if(/opera de paris|garnier|bastille/.test(t))p.ids=EVENTS.filter(e=>e.serie==="Opéra de Paris").map(e=>e.id);
  if(/gratuit/.test(t))p.max=0; else if(/pas cher|petit budget|petit prix|economique/.test(t))p.max=25;
  const mm=t.match(/moins de (\d+)/); if(mm)p.max=+mm[1];
  const STOP=new Set(["expo","expos","musee","salon","salons","theatre","festival","concert","musical","spectacle","comedy","club","paris","livre","presse","nuits","faire","pour","grand","petit","seul","tout","histoire","histoires","entre","deux","france","jeunesse","culturel","international","patrimoine","mere","prochain"]);
  // Les critères de date, genre et compagnie ne désignent pas un titre.
  for(const word of ['semaine','semaines','prochaine','prochaines','suivante','suivant','demain','apres','aujourd','hui','soir','soiree','soirees','journee','matin','week','weekend','samedi','dimanche','lundi','mardi','mercredi','jeudi','vendredi','amoureux','amoureuse','couple','romantique','famille','enfant','enfants','fille','fils','amis','amies','avec','dans','sans','cette','quel','quelle','quels','quelles','cherche','chercher','recherche','trouver','sortie','sorties','piece','pieces','theatres','concerts','spectacles','musique','humour','cinema','gratuit','gratuite','gratuites','gratuites','cher','budget','moins','euros','novembre','octobre','vacances','toussaint'])STOP.add(word);
  const titleTerms=new Set(t.split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOP.has(w)));
  const hits=EVENTS.filter(e=>norm(e.t).split(/[^a-z0-9]+/).some(w=>titleTerms.has(w)));
  if(!p.ids&&hits.length&&hits.length<8)p.ids=hits.map(e=>e.id);
  const venueHit=EVENTS.filter(e=>{const v=norm(e.venue+" "+e.city);return [...titleTerms].some(w=>w.length>4&&v.split(/[^a-z0-9]+/).includes(w))});
  if(!p.ids&&!p.cat&&venueHit.length&&venueHit.length<EVENTS.length/2)p.ids=venueHit.map(e=>e.id);
  return p;
}
function runAsk(p){
  const days=p.days||DAYS.map((d,i)=>i);
  const keepAges=S.ages; if(p.ages.length)S.ages=p.ages; else if(p.who==="famille"&&!S.ages.length)S.ages=AGES.slice();
  const out=[];
  for(const e of EVENTS){
    if(p.ids&&!p.ids.includes(e.id))continue;
    if(p.cat&&e.cat!==p.cat)continue;
    if(p.max!=null&&(e.price==null||e.price>p.max))continue;
    if(p.who==="famille"&&!e.aud.includes("famille")&&!((p.ages.length?p.ages:S.ages).includes(YA)&&(e.aud.includes("amis")||e.aud.includes("solo"))))continue;
    const i=days.find(i=>playsOn(e,DAYS[i])&&(!p.mom||(p.mom==="soir"?parseInt(timeOn(e,DAYS[i]))>=18:parseInt(timeOn(e,DAYS[i]))<18))); if(i==null)continue;
    const r=score(e,p.who,DAYS[i])||(p.ids||!p.who?score(e,null,DAYS[i])||{pct:40,why:[]}:null); if(!r)continue;
    out.push({...e,...r,hr:timeOn(e,DAYS[i]),di:i});
  }
  S.ages=keepAges;
  return out.sort((a,b)=>b.pct-a.pct).slice(0,20);
}

  const inApp=onboard>=STEPS&&!editing;
  $("#perfs").hidden=inApp;
  $("#perfs").innerHTML=Array.from({length:STEPS},(_,i)=>`<i class="${i<=onboard?"on":""}"></i>`).join("");
  $("#tabs").hidden=!inApp; $("#hsearch").hidden=!inApp; $("#havis").hidden=!inApp;
  $("#stubno").textContent=inApp?fmt(today,{weekday:"long",day:"numeric",month:"long"}):editing?"Modification":`Billet ${onboard+1} / ${STEPS}`;
  if(!inApp){view.innerHTML=onboardingView();bind();return}
  $("#tabsin").innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" ${page===t[0]&&!detailId?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${t[2]}</svg>${t[1]}</button>`).join("");
  view.innerHTML=detailId?pageDetail():{accueil:pageHome,avis:pageAvis,avisrecus:pageAvisRecus,billets:pageTickets,decouvrir:pageSwipe,recherche:pageSearch,weekend:pageWeekend,agenda:pageAgenda,favoris:pageFavs,profil:pageProfile}[page]();
  bind();
}
function go(p){page=p;detailId=null;try{history.replaceState(null,"","#"+p)}catch(e){}render();scrollTo({top:0})}

function bind(){
  const n=$("#next"),b=$("#back"),c=$("#cancel");
  if(n)n.onclick=()=>{ if(editing){editing=false;onboard=STEPS;save();go("profil");return}
    onboard++;save(); if(onboard>=STEPS){go("accueil");confetti()}else{render();scrollTo({top:0})} };
  if(b)b.onclick=()=>{onboard--;render()};
  if(c)c.onclick=()=>{Object.assign(S,JSON.parse(snapshot));editing=false;onboard=STEPS;go("profil")};
  const nm=$("#name"),ct=$("#city");
  if(nm){const chk=()=>{n.disabled=!(S.name&&S.city)};nm.oninput=e=>{S.name=e.target.value.trim();chk()};ct.oninput=e=>{S.city=e.target.value.trim();chk()}}
  const ua=$("#user-age");if(ua)ua.onchange=()=>{S.ageBand=validUserAge(ua.value)?ua.value:""};
  const A=(sel,fn)=>view.querySelectorAll(sel).forEach(el=>el.onclick=()=>fn(el));
  const tog=(arr,v)=>arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];
  A("[data-type]",el=>{S.types=tog(S.types,el.dataset.type);render()});
  A("[data-who]",el=>{S.who=tog(S.who,el.dataset.who);if(!S.who.includes("famille"))S.ages=[];else if(!S.types.includes("jeune"))S.types.push("jeune");render()});
  A("[data-age]",el=>{S.ages=tog(S.ages,el.dataset.age);render()});
  A("[data-duel]",el=>{S.duels[el.dataset.duel]=el.dataset.v;render()});
  A("[data-mom]",el=>{S.moments=tog(S.moments,el.dataset.mom);render()});
  A("[data-budget]",el=>{S.budget=el.dataset.budget;render()});
  // app
  document.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>go(el.dataset.tab));
  A("[data-day]",el=>{dayIdx=+el.dataset.day;render()});
  A("[data-wk]",el=>{wk=+el.dataset.wk;render()});
  A("[data-wkday]",el=>{wkDay=el.dataset.wkday;render()});
  A("[data-wkmom]",el=>{wkMom=el.dataset.wkmom;render()});
  A("[data-wkwho]",el=>{wkWho=el.dataset.wkwho;render()});
  A("[data-wkcat]",el=>{cat=el.dataset.wkcat;wk=0;go("weekend")});
  view.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>go(el.dataset.tab));
  A("[data-open]",el=>{detailId=+el.dataset.open;render();scrollTo({top:0})});
  A("[data-cat]",el=>{cat=el.dataset.cat;render()});
  const qi=$("#q"); if(qi)qi.oninput=e=>{q=e.target.value;const pos=qi.selectionStart;render();const n2=$("#q");n2.focus();n2.setSelectionRange(pos,pos)};
  const af=$("#askform"); if(af){af.onsubmit=ev=>{ev.preventDefault();const v=$("#ask").value.trim();if(!v)return;askQ=v;page="recherche";detailId=null;render();scrollTo({top:0})};
    let k=0;const inp=$("#ask");clearInterval(window._ph);window._ph=setInterval(()=>{if(!document.body.contains(inp)){clearInterval(window._ph);return}k=(k+1)%ASK_EX.length;inp.placeholder=ASK_EX[k]},3200)}
  A("[data-ask]",el=>{askQ=el.dataset.ask;page="recherche";detailId=null;render();scrollTo({top:0})});
  const goAvis=()=>{if(page!=="avis")avFrom=page;avState=avState==="ok"?"":avState;go("avis")};
  const hv=$("#havis"); if(hv)hv.onclick=goAvis;
  A("[data-goavis]",goAvis);
  A("[data-star]",el=>{avForm.note=+el.dataset.star;render()});
  A("[data-usage]",el=>{avForm.usage=el.dataset.usage;render()});
  const ta=$("#av-aime"),tm=$("#av-manque"),tp=$("#av-prenom");
  if(ta)ta.oninput=e=>{avForm.aime=e.target.value}; if(tm)tm.oninput=e=>{avForm.manque=e.target.value}; if(tp)tp.oninput=e=>{avForm.prenom=e.target.value};
  const avf=$("#avform"); if(avf)avf.onsubmit=ev=>{ev.preventDefault();sendAvis()};
  const avc=$("#avcopy"); if(avc)avc.onclick=()=>{const t=$("#av-copy");const done=()=>{avc.textContent="Copié"};try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select()})}catch(e){t.select()}};
  const avr=$("#avreload"); if(avr)avr.onclick=()=>{avList=null;render()};
  const hs=$("#hsearch"); if(hs)hs.onclick=()=>{page="recherche";detailId=null;render();const i=$("#ask");if(i)i.focus()};
  const tog2=(arr,v)=>arr.some(x=>nA(x)===nA(v))?arr.filter(x=>nA(x)!==nA(v)):[...arr,v];
  A("[data-art]",el=>{S.artists=tog2(S.artists,el.dataset.art);save();
    if(el.closest(".artbox")&&follows(el.dataset.art)===(el.getAttribute("aria-pressed")!=="true")&&!el.textContent.includes("✕")){el.setAttribute("aria-pressed",String(follows(el.dataset.art)));artDirty=true;const sm=$("#artsum"),an=$("#artn");if(sm)sm.textContent=artSummary();if(an)an.textContent=S.artists.length}
    else{artOpen=!!el.closest(".artbox");render()}});
  const ab=$("#artbox"); if(ab)ab.ontoggle=()=>{artOpen=ab.open;const l=ab.querySelector("summary .link");if(l)l.textContent=ab.open?"Fermer":"Modifier";if(!ab.open&&artDirty){artDirty=false;render()}};
  const ok=$("#artok"); if(ok)ok.onclick=()=>{artOpen=false;artDirty=false;render();scrollTo({top:0,behavior:"smooth"})};
  A("[data-follow]",el=>{S.artists=tog2(S.artists,el.dataset.follow);save();render()});
  A("[data-alert]",el=>{const k=el.dataset.alert;S.alerts=S.alerts.includes(k)?S.alerts.filter(x=>x!==k):[...S.alerts,k];save();render()});
  A("[data-tk]",el=>{tkFilter=el.dataset.tk;render()});
  const ai=$("#artin"),aa=$("#artadd"); if(ai){const add=()=>{const v=ai.value.trim();if(v&&!follows(v)){S.artists=[...S.artists,v];artOpen=true;save();render();const n=$("#artin");if(n)n.focus()}};aa.onclick=add;ai.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();add()}}}
  A("[data-sw]",el=>swAct(el.dataset.sw)); bindSwipe();
  const swr=$("#swreset"); if(swr)swr.onclick=()=>{seen=new Set();swToast="";render()};
  const db=$("#dback"); if(db)db.onclick=()=>{detailId=null;render()};
  const fv=$("#fav"); if(fv)fv.onclick=()=>{favs=tog(favs,detailId);save();render()};
  A("[data-soon]",el=>{$("#soon").textContent=el.dataset.soon==="billet"?"Réservation : connexion aux billetteries partenaires prévue en phase 2.":"Restaurants autour de la salle : connexion à un partenaire de réservation prévue en phase 2."});
  A("[data-edit]",el=>{snapshot=JSON.stringify(S);editing=true;onboard=+el.dataset.edit;render();scrollTo({top:0})});
  const r=$("#restart"); if(r)r.onclick=()=>{Object.assign(S,JSON.parse(JSON.stringify(DEFAULT)));onboard=0;editing=false;dayIdx=0;save();render()};
}
let snapshot="{}";

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#FF4F1F","#FFD43B","#0A9E95","#D63F7A"];
  const P=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,r:Math.random()*6+4,a:Math.random()*6,c:cols[Math.random()*4|0]}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
  if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}
